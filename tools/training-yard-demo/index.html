<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14231f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>青溪演武區</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script>
</head>
<body>
<canvas id="world" aria-label="青溪公共演武區，第一人稱三維場景"></canvas>
<div id="vignette" aria-hidden="true"></div>

<header class="hud-top">
  <div class="title">
    <span class="eyebrow">雲境 · 青溪初入世</span>
    <h1>公共演武區</h1>
    <span class="notice">本機演示 · 刷新重置 · 不產生正式修為</span>
  </div>
  <div class="identity" role="group" aria-label="演示身分">
    <span class="label">演示身分</span>
    <button id="root-yes" class="seg on" aria-pressed="true">有靈根</button>
    <button id="root-no" class="seg" aria-pressed="false">凡骨</button>
    <button id="reset" class="ghost" title="回到村口">回村口</button>
  </div>
</header>

<div id="prompt" class="prompt" role="status">沿土路走向演武棚</div>
<div id="hint" class="hint">WASD／方向鍵移動 · 拖曳轉向 · E 互動</div>

<!-- choose a practice at a post -->
<section id="chooser" class="card chooser" hidden aria-label="選擇練功">
  <button class="close" data-close aria-label="離開">×</button>
  <span class="eyebrow">安全練習 · 失誤可重來</span>
  <h2 id="chooser-title">選擇練功</h2>
  <div class="options">
    <button id="pick-qi" class="option qi">
      <b>引氣呼吸</b><span>氣勁木樁 · 跟著繩圈與玉紋的節奏吸吐，三息調和</span><em id="qi-lock"></em>
    </button>
    <button id="pick-body" class="option body">
      <b>武技格擋</b><span>身法木樁 · 看木臂來勢，左右下三向格擋</span><em>凡骨亦可修習</em>
    </button>
  </div>
</section>

<!-- qi breathing HUD -->
<section id="qi-hud" class="practice" hidden aria-label="引氣呼吸">
  <div class="ring-wrap">
    <svg viewBox="-100 -100 200 200" class="rings" aria-hidden="true">
      <circle r="92" class="track"/>
      <circle id="guide" r="60" class="guide"/>
      <circle id="qi-ring" r="30" class="qi"/>
    </svg>
    <div id="phase" class="phase">凝神</div>
  </div>
  <div class="breath-side">
    <div class="cycles" aria-label="三息">
      <i data-c="0"></i><i data-c="1"></i><i data-c="2"></i>
    </div>
    <p id="qi-tip" class="tip">金圈擴張時按住吸氣，「停」時繼續按住；金圈收回時放開吐氣。</p>
    <div id="sync" class="sync"><span></span></div>
  </div>
  <button id="hold" class="hold" aria-label="按住引氣">按住<br><small>空白鍵</small></button>
</section>

<!-- block rhythm HUD -->
<section id="body-hud" class="practice" hidden aria-label="武技格擋">
  <div class="combo"><b id="combo">0</b><span>連擋</span></div>
  <div id="judge" class="judge"></div>
  <div class="blocks">
    <button data-side="left" class="block left"><i></i><b>← 左臂</b><small>A</small></button>
    <button data-side="low" class="block low"><i></i><b>↓ 下樁</b><small>S</small></button>
    <button data-side="right" class="block right"><i></i><b>右臂 →</b><small>D</small></button>
  </div>
  <p id="body-tip" class="tip">木臂後擺蓄勢，光圈收到按鍵上時格擋。空按會散了架勢。</p>
</section>

<!-- result -->
<section id="result" class="card result" hidden aria-label="練習結果">
  <span class="eyebrow" id="result-kind">練習結果</span>
  <h2 id="result-grade">—</h2>
  <p id="result-detail"></p>
  <p class="fine">只記本輪表現：正式修為由伺服器 practice-basic 判定，本頁不會呼叫。</p>
  <div class="row">
    <button id="again" class="primary">再練一次</button>
    <button id="switch">換另一種</button>
    <button data-close>離開</button>
  </div>
</section>

<nav id="touch" class="touch" aria-label="觸控操作">
  <div id="stick" class="stick"><i></i></div>
  <button id="interact" class="interact">互動</button>
</nav>

<div id="loading" class="loading"><b>青溪演武區</b><span id="load-text">載入模型 0/7</span><i id="load-bar"></i></div>
<script type="module" src="app.mjs"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('offline cache unavailable',e)));</script>
</body>
</html>
